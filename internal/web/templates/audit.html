<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat - Audit Log</title>
<style>
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2128;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
  --accent: #58a6ff; --positive: #3fb950; --negative: #f85149; --warning: #d29922;
  --radius: 8px; --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }
.header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 20px; font-weight: 600; }
.back { color: var(--text-muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--accent); }
.filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.filters input, .filters select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
.btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--accent); color: #000; }
table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
.mono { font-family: var(--mono); font-size: 12px; }
.empty { color: var(--text-dim); font-style: italic; padding: 40px; text-align: center; }
.pagination { display: flex; gap: 12px; margin-top: 16px; align-items: center; }
.pagination a { color: var(--accent); text-decoration: none; }
a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="/" class="back">← Dashboard</a>
    <h1>Audit Log</h1>
  </div>
  <form class="filters" method="get" action="/audit">
    <input type="text" name="actor" placeholder="Actor ID" value="{{.Actor}}">
    <input type="text" name="action" placeholder="Action" value="{{.Action}}">
    <button class="btn" type="submit">Filter</button>
  </form>
  {{if .Events}}
  <table>
    <thead>
      <tr><th>Actor</th><th>Action</th><th>Target</th><th>Timestamp</th></tr>
    </thead>
    <tbody>
      {{range .Events}}
      <tr>
        <td class="mono">{{if .ActorID}}{{.ActorID}}{{else}}-{{end}}</td>
        <td>{{.Action}}</td>
        <td class="mono">{{.TargetType}}:{{.TargetID}}</td>
        <td>{{.CreatedAt}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <div class="empty">No audit events</div>
  {{end}}
  <div class="pagination">
    {{if .HasPrev}}<a href="/audit?actor={{.Actor}}&action={{.Action}}&page={{.Prev}}">← Prev</a>{{end}}
    <span>Page {{.Page}}</span>
    {{if .HasNext}}<a href="/audit?actor={{.Actor}}&action={{.Action}}&page={{.Next}}">Next →</a>{{end}}
  </div>
</div>
</body>
</html>
