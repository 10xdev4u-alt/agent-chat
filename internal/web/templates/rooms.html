<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Chat - Rooms</title>
<style>
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2128;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
  --accent: #58a6ff; --positive: #3fb950; --radius: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
.header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 20px; font-weight: 600; }
.back { color: var(--text-muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--accent); }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.room-item { padding: 12px; border-bottom: 1px solid var(--border); }
.room-item:last-child { border-bottom: none; }
.room-link { color: var(--accent); text-decoration: none; font-weight: 600; }
.room-link:hover { text-decoration: underline; }
a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="/" class="back">← Dashboard</a>
    <h1>Rooms</h1>
  </div>
  <div class="card">
    {{if .Rooms}}
    {{range .Rooms}}
    <div class="room-item">
      <a href="/rooms/{{.ID}}" class="room-link">{{.Name}}</a>
    </div>
    {{end}}
    {{else}}
    <p style="color:var(--text-dim);font-style:italic;padding:20px;text-align:center">No rooms yet</p>
    {{end}}
  </div>
</div>
</body>
</html>
